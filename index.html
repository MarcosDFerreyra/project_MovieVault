<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieVault</title>
    <script type="module" src="src/js/main.js"></script>
    <script type="module" src="src/js/home.js"></script>


</head>

<body>
    <header class="header_css" id="main-header"></header>

    <main class="container">

        <section class="introduction">
            <img src="/images/logo.png" alt="MovieVault logo" >
            <h1>The Greatest App For Movie Research</h1>
            <p>Discover popular movies, search for your next favorite, and explore detailed information all in one place. Compare
            ratings, check movie details, and save the films you love to your personal favorites.</p>
        </section>

        <section class="search_section" id="search_section">
            <h3>Search for Movies!!!</h3>

            <form id="search-form">
                <label for="search-input"></label>
                <input id="search-input" type="text">
                <button type="submit">Search</button>
            </form>
        </section>

        <div>
            <section class="home_movies" >
                
                <h2>Popular Movies</h2>
                <div class="movie-section" id="popular_movies">
                    <!-- JS genera las películas acá -->
                </div>
                <h2> Movies</h2>
                <div class="movie-section" id="movies_2020">
                    <!-- JS genera las películas acá -->
                </div>
                <h2> Movies</h2>
                <div class="movie-section" id="highest_rated">
                    <!-- JS genera las películas acá -->
                </div>
                <h2> Movies</h2>
                <div class="movie-section" id="worst_movies">
                    <!-- JS genera las películas acá -->
                </div>

            </section>
        </div>

    </main>
    <footer id="main-footer"></footer>
    
</body>

</html>
